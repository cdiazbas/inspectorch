[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectorch"
description = "Efficient rare event exploration with normalizing flows"
authors = [
  { name = "Carlos Jose Diaz Baso" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["normalizing flows", "rare events", "machine learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "nflows>=0.14",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "einops>=0.6.0",
    "scipy>=1.7.0",
    "tqdm>=4.60.0",
    "flow_matching>=1.0.0",
    "torchdiffeq>=0.2.3",
    "torchcfm>=1.0.0",
    "pot>=0.9.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
# Development tools
dev = ["pytest", "pytest-cov", "ruff", "black", "pandas"]

# Running the example notebooks
notebook = ["ipykernel>=6.0.0", "jupyterlab>=3.0.0"]

# Complete installation with all features
all = [
    "pytest", "pytest-cov", "ruff", "black", "pandas",  # dev
    "ipykernel>=6.0.0", "jupyterlab>=3.0.0",  # notebook
]

[project.urls]
Homepage = "https://github.com/cdiazbas/inspectorch"

[tool.setuptools]
packages = ["inspectorch"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "1.0.dev0"

[tool.ruff.lint]
# Selected explicitly so the rule set does not drift between ruff versions
# (pre-commit pins one, a developer's CLI may have another).
#   B015/B018 - a comparison or expression whose result is discarded.
#   F821      - undefined name.
# F821 and F601 were previously ignored and were masking real defects, so
# they are deliberately absent from `ignore` below.
select = ["E4", "E7", "E9", "F", "B015", "B018"]
ignore = ["E702", "E402", "E722"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "slow: end-to-end runs of the example scripts (deselect with -m 'not slow')",
]
