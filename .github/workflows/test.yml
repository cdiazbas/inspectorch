name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check inspectorch/ test/

      - name: Check for discarded expression results
        run: python tools/check_dead_expressions.py inspectorch/*.py test/*.py

      - name: Test
        run: pytest -q -m "not slow"

      # The example scripts are the documented entry point, so they are
      # run end to end (on a subsampled cube, one epoch) rather than only
      # linted. Slower, so they run once rather than per Python version.
      - name: Test examples end to end
        if: matrix.python-version == '3.11'
        run: pytest -q -m slow
