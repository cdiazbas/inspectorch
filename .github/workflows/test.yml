name: tests

# Automatic runs are off: start the workflow by hand from the Actions tab.
# To turn them back on, add `push: {branches: [main]}` and `pull_request:`.
on:
  workflow_dispatch:

jobs:
  # What must never be published: absolute paths of a personal machine,
  # audit working files, and assistant attribution anywhere in history.
  # The patterns are assembled at run time so that this file does not
  # match itself.
  publication-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No absolute home paths in tracked files
        run: |
          if git grep -n "/""Users/"; then
            echo "::error::absolute home path in a tracked file"
            exit 1
          fi

      - name: No audit working files tracked
        run: |
          if git ls-files | grep -iE "(^|/)audits?/|audit[^/]*\.md$|_verify\.py$"; then
            echo "::error::audit working files must stay untracked"
            exit 1
          fi

      - name: No assistant attribution in history
        run: |
          pattern="$(echo Y2xhdWRlfGFudGhyb3BpY3xjby1hdXRob3JlZA== | base64 -d)"
          if git log --format=%B | grep -inE "$pattern"; then
            echo "::error::attribution in a commit message"
            exit 1
          fi
          if git log -p --format= | grep -inE "$pattern"; then
            echo "::error::attribution in a committed file"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,flow-matching]"

      - name: Lint
        run: ruff check inspectorch/ test/

      - name: Check for discarded expression results
        run: python tools/check_dead_expressions.py inspectorch/*.py test/*.py

      - name: Test
        run: pytest -q -m "not slow"

      # The example scripts are the documented entry point, so they are
      # run end to end (on a subsampled cube, one epoch) rather than only
      # linted. Slower, so they run once rather than per Python version.
      - name: Test examples end to end
        if: matrix.python-version == '3.11'
        run: pytest -q -m slow
