exclude: .*(\.fits|\.fts|\.fit|\.txt|\.csv|_least_angle\.py)|public/.*$
repos:
  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.7
    hooks:
      - id: docformatter
        args:
          - --in-place
          - --pre-summary-newline
          - --make-summary-multi
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args:
          - --in-place
          - --remove-all-unused-imports
          # NOTE: --remove-unused-variable is deliberately NOT enabled. It
          # rewrites `x = f()` into a bare `f()` when x is unused, which
          # silently detaches a computed result from its consumer. That is
          # how the normalization log-det in flow_matching_sbi.log_prob was
          # lost. See tools/check_dead_expressions.py.
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        # Rule selection lives in pyproject.toml [tool.ruff.lint] so it is
        # identical here and in a developer's local ruff.
        # --unsafe-fixes is deliberately NOT enabled: like autoflake's
        # --remove-unused-variable, it can rewrite code in ways that change
        # behaviour without review.
        args:
          - --fix
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-dead-expressions
        name: check for discarded expression results
        entry: python tools/check_dead_expressions.py
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: check-yaml
      - id: debug-statements
  # See https://github.com/python-trio/trio/pull/3255
